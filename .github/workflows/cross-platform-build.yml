name: Cross-platform build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
          - os: macos-latest
            platform: darwin/universal

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Add Go binaries to PATH
        shell: bash
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build Wails application
        run: wails build -platform ${{ matrix.platform }}

      - name: Run Go tests
        run: go test ./...

      - name: Package macOS app
        if: matrix.platform == 'darwin/universal'
        run: ditto -c -k --sequesterRsrc --keepParent build/bin/FinalProject.app build/bin/PhotoBackup-macOS-universal.zip

      - name: Upload Windows app
        if: matrix.platform == 'windows/amd64'
        uses: actions/upload-artifact@v4
        with:
          name: PhotoBackup-Windows-amd64
          path: build/bin/FinalProject.exe
          if-no-files-found: error
          retention-days: 7

      - name: Upload macOS app
        if: matrix.platform == 'darwin/universal'
        uses: actions/upload-artifact@v4
        with:
          name: PhotoBackup-macOS-universal
          path: build/bin/PhotoBackup-macOS-universal.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build files
        uses: actions/download-artifact@v4
        with:
          pattern: PhotoBackup-*
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/FinalProject.exe
            release-assets/PhotoBackup-macOS-universal.zip
